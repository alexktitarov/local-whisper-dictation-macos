<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Local Whisper architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #4f7cff; stroke-width: 1.5; }
      .accent { fill: #eef3ff; }
      .ai { fill: #f4efff; stroke: #8b5cf6; }
      .title { font-size: 15px; font-weight: 600; fill: #1b2230; }
      .sub { font-size: 12px; fill: #5b6478; }
      .edge { fill: none; stroke: #5b6478; stroke-width: 1.5; }
      .label { font-size: 11.5px; fill: #5b6478; }
      .lane { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #4f7cff; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="439" rx="18" fill="#f7f9fc" stroke="#dfe4ee"/>

  <!-- lane captions -->
  <text class="lane" x="430" y="30">WHILE YOU SPEAK</text>
  <text class="lane" x="430" y="292">WHEN YOU RELEASE</text>

  <!-- input -->
  <rect class="node" x="24" y="190" width="160" height="60" rx="10"/>
  <text class="title" x="104" y="215" text-anchor="middle">HotkeyMonitor</text>
  <text class="sub" x="104" y="234" text-anchor="middle">right Option · Shift</text>

  <rect class="node" x="224" y="190" width="170" height="60" rx="10"/>
  <text class="title" x="309" y="215" text-anchor="middle">AudioRecorder</text>
  <text class="sub" x="309" y="234" text-anchor="middle">mic → 16 kHz mono</text>

  <!-- live path -->
  <rect class="node" x="430" y="44" width="260" height="56" rx="10"/>
  <text class="title" x="560" y="67" text-anchor="middle">Transcriber</text>
  <text class="sub" x="560" y="86" text-anchor="middle">WhisperKit · Core ML · Neural Engine</text>

  <rect class="node accent" x="430" y="140" width="260" height="64" rx="10"/>
  <text class="title" x="560" y="166" text-anchor="middle">StreamingSession</text>
  <text class="sub" x="560" y="186" text-anchor="middle">LocalAgreement · deferred punctuation</text>

  <rect class="node" x="746" y="112" width="228" height="56" rx="10"/>
  <text class="title" x="860" y="135" text-anchor="middle">Typer</text>
  <text class="sub" x="860" y="154" text-anchor="middle">committed words → keystrokes</text>

  <rect class="node" x="746" y="184" width="228" height="56" rx="10"/>
  <text class="title" x="860" y="207" text-anchor="middle">RecordingHUD</text>
  <text class="sub" x="860" y="226" text-anchor="middle">waveform + live caption</text>

  <!-- release path -->
  <rect class="node" x="430" y="318" width="190" height="60" rx="10"/>
  <text class="title" x="525" y="343" text-anchor="middle">Full-recording pass</text>
  <text class="sub" x="525" y="362" text-anchor="middle">if nothing was typed live</text>

  <polygon class="node" points="700,304 752,348 700,392 648,348"/>
  <text class="sub" x="700" y="344" text-anchor="middle" style="font-weight:600;fill:#1b2230">Prompt</text>
  <text class="sub" x="700" y="359" text-anchor="middle" style="font-weight:600;fill:#1b2230">mode?</text>

  <rect class="node ai" x="786" y="270" width="188" height="56" rx="10"/>
  <text class="title" x="880" y="293" text-anchor="middle">PromptRewriter</text>
  <text class="sub" x="880" y="312" text-anchor="middle">LLM on Groq · streamed</text>

  <rect class="node" x="786" y="364" width="188" height="56" rx="10"/>
  <text class="title" x="880" y="387" text-anchor="middle">Paster</text>
  <text class="sub" x="880" y="406" text-anchor="middle">clipboard + Cmd V, restored</text>

  <!-- edges -->
  <path class="edge" d="M184,220 L220,220" marker-end="url(#arrow)"/>
  <path class="edge" d="M394,212 C412,212 408,172 426,172" marker-end="url(#arrow)"/>
  <path class="edge" d="M394,228 C412,228 408,348 426,348" marker-end="url(#arrow)"/>
  <path class="edge" d="M560,104 L560,136" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M690,164 C716,164 716,140 742,140" marker-end="url(#arrow)"/>
  <path class="edge" d="M690,180 C716,180 716,212 742,212" marker-end="url(#arrow)"/>
  <path class="edge" d="M620,348 L644,348" marker-end="url(#arrow)"/>
  <path class="edge" d="M740,330 C760,300 766,298 782,298" marker-end="url(#arrow)"/>
  <path class="edge" d="M740,366 C760,392 766,392 782,392" marker-end="url(#arrow)"/>
  <path class="edge" d="M880,326 L880,360" marker-end="url(#arrow)"/>

  <text class="label" x="584" y="124">audio ⇄ text</text>
  <text class="label" x="752" y="316">yes</text>
  <text class="label" x="752" y="400">no</text>
</svg>
